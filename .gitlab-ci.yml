stages:
  - build
  - publish

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  PROJECT_PATH: "src/NdiDirector.csproj"

# ============================================================
# Build — Compilação e verificação
# ============================================================
build:
  stage: build
  tags:
    - windows
  script:
    - dotnet restore $env:PROJECT_PATH
    - dotnet build $env:PROJECT_PATH -c Release --no-restore
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Publish — Gera o pacote de distribuição (dist/)
# ============================================================
publish:
  stage: publish
  tags:
    - windows
  script:
    - dotnet publish $env:PROJECT_PATH -c Release -o dist --no-restore
  artifacts:
    name: "NdiDirector-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
